version: '3.8'

services:
  currency-detection:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: currency-detection-app
    ports:
      - "3000:3000"
    volumes:
      # Mount uploads directory for persistent storage
      - ./uploads:/app/uploads
      # Mount reference notes (read-only)
      - ./reference_notes:/app/reference_notes:ro
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - currency-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: currency-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - currency-detection
    restart: unless-stopped
    networks:
      - currency-network
    profiles:
      - production

networks:
  currency-network:
    driver: bridge